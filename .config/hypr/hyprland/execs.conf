# Input method
# exec-once = fcitx5

# Core components (keyring, authentication, lock screen)
exec-once = gnome-keyring-daemon --start --components=secrets
exec-once = hypridle
exec-once = dbus-update-activation-environment --all
exec-once = sleep 1 && dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP # Some fix idk

# Shell, wallpaper, notifications, OSD, and launcher
# Noctalia replaces the old HyprPanel/AGS stack and owns these surfaces.
exec-once = noctalia --daemon

# KDE Connect daemon and tray indicator. The guards keep startup quiet until
# the optional kdeconnect package is installed.
exec-once = command -v kdeconnectd >/dev/null && kdeconnectd
exec-once = command -v kdeconnect-indicator >/dev/null && kdeconnect-indicator

exec-once = hyprpm reload

# Cursor
exec-once = hyprctl setcursor Bibata-Modern-Classic 32
# exec-once = gsettings set org.gnome.desktop.interface cursor-theme Bibata-Modern-Classic 
# exec-once = gsettings set org.gnome.desktop.interface cursor-size 24

# Audio and Bluetooth panels are provided by Noctalia.
