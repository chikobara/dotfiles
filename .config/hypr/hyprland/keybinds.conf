# Lines ending with `# [hidden]` won't be shown on cheatsheet
# Lines starting with #! are section headings

bindl = Alt ,XF86AudioMute, exec, noctalia msg mic-mute # [hidden]
bindl = Super ,XF86AudioMute, exec, noctalia msg mic-mute # [hidden]
bindl = ,XF86AudioMute, exec, noctalia msg volume-mute # [hidden]
bindl = Super+Shift,M, exec, noctalia msg volume-mute # [hidden]
bindle=, XF86AudioRaiseVolume, exec, noctalia msg volume-up # [hidden]
bindle=, XF86AudioLowerVolume, exec, noctalia msg volume-down # [hidden]
bindle=, XF86Launch3, exec, noctalia msg panel-toggle control-center audio

bindle =, XF86MonBrightnessUp, exec, noctalia msg brightness-up
bindle =, XF86MonBrightnessDown, exec, noctalia msg brightness-down
#Refresh rate switcher 
bind = super, O, exec, ~/Documents/refresh_rate_serivce/refresh_rate_adjuster.sh
#!
##! Essentials for beginners

# bindr = Super, super, exec, launcher_t6 # Open app launcher
bind = Super, r, exec, kitty -c ~/.config/kitty/kitty-hyprland.conf # Launch foot (terminal)
bind = Super, g, exec, ghostty
bind = Ctrl+Super, T, exec, noctalia msg panel-toggle wallpaper # Change wallpaper
##! Actions
# Screenshot, Record, OCR, Color picker, Clipboard history
bind = Super, V, exec, noctalia msg panel-toggle clipboard # Clipboard history >> clipboard
bind = Super, Period, exec, noctalia msg panel-toggle launcher /emo # Pick emoji >> clipboard
bind = Ctrl+Shift+Alt, Delete, exec, noctalia msg panel-toggle session # [hidden]
bind = Super+Shift, S, exec, noctalia msg screenshot-annotate # Screen snip
bind = Shift+Alt, S, exec, grimblast --notify copysave area # Screen snip >> clipboard

# OCR
bind = Super+Shift, T,exec,grim -g "$(slurp $SLURP_ARGS)" "tmp.png" && tesseract -l eng+jpn+ara "tmp.png" - | wl-copy && rm "tmp.png" # Screen snip to text >> clipboard
bind = Ctrl+Super+Shift,S,exec,grim -g "$(slurp $SLURP_ARGS)" "tmp.png" && tesseract "tmp.png" - | wl-copy && rm "tmp.png" # [hidden]
# Color picker
bind = Super+Shift, C, exec, hyprpicker -a # Pick color (Hex) >> clipboard
# Fullscreen screenshot
bindl=,Print,exec,grim - | wl-copy # Screenshot >> clipboard
bindl= Ctrl,Print, exec, mkdir -p ~/Pictures/Screenshots && grimblast copysave screen ~/Pictures/Screenshots/Screenshot_"$(date '+%Y-%m-%d_%H.%M.%S')".png # Screenshot >> clipboard & file
# Recording stuff
bind = Super+Alt, R, exec, ~/.config/hypr/scripts/record-screen.sh # Record region (no sound)
bind = Ctrl+Alt, R, exec, ~/.config/hypr/scripts/record-screen.sh --fullscreen # [hidden] Record screen (no sound)
bind = Super+Shift+Alt, R, exec, ~/.config/hypr/scripts/record-screen.sh --fullscreen-sound # Record screen (with sound)
##! Session
bind = Super, L, exec, noctalia msg session lock # Lock with Noctalia
bind = Super+Shift, L, exec, noctalia msg session lock # [hidden]
bindl = Super+Shift, L, exec, sleep 0.1 && systemctl suspend || loginctl suspend # Suspend system
bindl = Ctrl+Super+Shift, L, exec, sleep 0.1 && systemctl hibernate # Suspend system
bind = Ctrl+Shift+Alt+Super, Delete, exec, systemctl poweroff || loginctl poweroff # [hidden] Power off

#!
##! Window management
# Focusing
#/# bind = Super, ←/↑/→/↓,, # Move focus in direction
bind = Super, Left, movefocus, l # [hidden]
bind = Super, Right, movefocus, r # [hidden]
bind = Super, Up, movefocus, u # [hidden]
bind = Super, Down, movefocus, d # [hidden]
bind = Super, BracketLeft, movefocus, l # [hidden]
bind = Super, BracketRight, movefocus, r # [hidden]
bindm = Super, mouse:272, movewindow
bindm = Super, mouse:273, resizewindow
bind = Super, Q, killactive,
bind = Super+Shift+Alt, Q, exec, hyprctl kill # Pick and kill a window
##! Window arrangement
#/# bind = Super+Shift, ←/↑/→/↓,, # Window: move in direction
bind = Super+Shift, Left, movewindow, l # [hidden]
bind = Super+Shift, Right, movewindow, r # [hidden]
bind = Super+Shift, Up, movewindow, u # [hidden]
bind = Super+Shift, Down, movewindow, d # [hidden]
# Window split ratio
#/# binde = Super, +/-,, # Window: split ratio +/- 0.1
binde = Super, Minus, layoutmsg, splitratio -0.1 # [hidden]
binde = Super, Equal, layoutmsg, splitratio +0.1 # [hidden]
binde = Super, Semicolon, layoutmsg, splitratio -0.1 # [hidden]
binde = Super, Apostrophe, layoutmsg, splitratio +0.1 # [hidden]
# Positioning mode
bind = Super+Alt, P, togglefloating,
bind = Super+Alt, F, fullscreenstate, 0 3 # Toggle fake fullscreen
bind = Super, F, fullscreen, 0
bind = Super, D, fullscreen, 1

#!
##! Workspace navigation
# Switching
#/# bind = Super, Hash,, # Focus workspace # (1, 2, 3, 4, ...)
# Switch workspaces with mainMod + [0-9]
$mainMod = SUPER
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10
#/# bind = Ctrl+Super, ←/→,, # Workspace: focus left/right
bind = Ctrl+Super, Right, workspace, +1 # [hidden]
bind = Ctrl+Super, Left, workspace, -1 # [hidden]
#/# bind = Super, Scroll ↑/↓,, # Workspace: focus left/right
bind = Super, mouse_up, workspace, -1 # [hidden]
bind = Super, mouse_down, workspace, +1 # [hidden]
bind = Ctrl+Super, mouse_up, workspace, +1 # [hidden]
bind = Ctrl+Super, mouse_down, workspace, -1 # [hidden]
#/# bind = Super, Page_↑/↓,, # Workspace: focus left/right
bind = Super, Page_Down, workspace, +1 # [hidden]
bind = Super, Page_Up, workspace, -1 # [hidden]
bind = Ctrl+Super, Page_Down, workspace, +1 # [hidden]
bind = Ctrl+Super, Page_Up, workspace, -1 # [hidden]
## Special
bind = Super, P, togglespecialworkspace,
# bind = Super, mouse:275, togglespecialworkspace,

##! Workspace management
# Move window to workspace Super + Alt + [0-9]
#/# bind = Super+Alt, Hash,, # Window: move to workspace # (1, 2, 3, 4, ...)
bind = Super+Alt, 1, movetoworkspacesilent, 1 # [hidden]
bind = Super+Alt, 2, movetoworkspacesilent, 2 # [hidden]
bind = Super+Alt, 3, movetoworkspacesilent, 3 # [hidden]
bind = Super+Alt, 4, movetoworkspacesilent, 4 # [hidden]
bind = Super+Alt, 5, movetoworkspacesilent, 5 # [hidden]
bind = Super+Alt, 6, movetoworkspacesilent, 6 # [hidden]
bind = Super+Alt, 7, movetoworkspacesilent, 7 # [hidden]
bind = Super+Alt, 8, movetoworkspacesilent, 8 # [hidden]
bind = Super+Alt, 9, movetoworkspacesilent, 9 # [hidden]
bind = Super+Alt, 0, movetoworkspacesilent, 10 # [hidden]

bind = Ctrl+Super+Shift, Up, movetoworkspacesilent, special # [hidden]

bind = Ctrl+Super+Shift, Right, movetoworkspace, +1 # [hidden]
bind = Ctrl+Super+Shift, Left, movetoworkspace, -1 # [hidden]
bind = Ctrl+Super, BracketLeft, workspace, -1 # [hidden]
bind = Ctrl+Super, BracketRight, workspace, +1 # [hidden]
bind = Ctrl+Super, Up, workspace, -5 # [hidden]
bind = Ctrl+Super, Down, workspace, +5 # [hidden]
#/# bind = Super+Shift, Scroll ↑/↓,, # Window: move to workspace left/right
bind = Super+Shift, mouse_down, movetoworkspace, -1 # [hidden]
bind = Super+Shift, mouse_up, movetoworkspace, +1 # [hidden]
bind = Super+Alt, mouse_down, movetoworkspace, -1 # [hidden]
bind = Super+Alt, mouse_up, movetoworkspace, +1 # [hidden]
#/# bind = Super+Shift, Page_↑/↓,, # Window: move to workspace left/right
bind = Super+Alt, Page_Down, movetoworkspace, +1 # [hidden]
bind = Super+Alt, Page_Up, movetoworkspace, -1 # [hidden]
bind = Super+Shift, Page_Down, movetoworkspace, +1  # [hidden]
bind = Super+Shift, Page_Up, movetoworkspace, -1  # [hidden]
bind = Super+Alt, S, movetoworkspacesilent, special
bind = Super+Shift, P, pin

bind = Ctrl+Super, S, togglespecialworkspace, # [hidden]
bind = Alt, Tab, cyclenext # [hidden] sus keybind
bind = Alt, Tab, bringactivetotop, # [hidden] bring it to the top

#!
##! Widgets
bindr = Ctrl+Super, R, exec, ~/.config/hypr/scripts/restart-noctalia.sh # Restart Noctalia
bindr = Ctrl+Super+Alt, R, exec, hyprctl reload # [hidden]
bind = Ctrl+Alt, Slash, exec, noctalia msg bar-toggle # Toggle bar
bind = Super, Tab, exec, noctalia msg panel-toggle launcher # Open launcher
bind = Super, A, exec, noctalia msg panel-toggle control-center # [hidden]
bind = Super, S, exec, noctalia msg panel-toggle control-center power
bind = Super, M, exec, noctalia msg panel-toggle control-center media
bind = Super, N, exec, noctalia msg panel-toggle control-center notifications
bind = Super, Comma, exec, noctalia msg settings-toggle
bind = ctrl+Alt, Delete, exec, noctalia msg panel-toggle session
# Testing
# bind = SuperAlt, f12, exec, notify-send "Hyprland version: $(hyprctl version | head -2 | tail -1 | cut -f2 -d ' ')" "owo" -a 'Hyprland keybind'
# bind = Super+Alt, f12, exec, notify-send "Millis since epoch" "$(date +%s%N | cut -b1-13)" -a 'Hyprland keybind'
bind = Super+Alt, f12, exec, notify-send 'Test notification' "Here's a really long message to test truncation and wrapping\nYou can middle click or flick this notification to dismiss it!" -a 'Shell' -A "Test1=I got it!" -A "Test2=Another action" -t 5000 # [hidden]
bind = Super+Alt, Equal, exec, notify-send "Urgent notification" "Ah hell no" -u critical -a 'Hyprland keybind' # [hidden]

##! Media
bindl= Super+Shift, N, exec, noctalia msg media next # Next track
bindl= ,XF86AudioNext, exec, noctalia msg media next # [hidden]
bindl= ,XF86AudioPrev, exec, noctalia msg media previous # [hidden]
bind = Super+Shift+Alt, mouse:275, exec, noctalia msg media previous # [hidden]
bind = Super+Shift+Alt, mouse:276, exec, noctalia msg media next # [hidden]
bindl= Super+Shift, B, exec, noctalia msg media previous # Previous track
bindl= Super+Shift, P, exec, noctalia msg media toggle # Play/pause media
bindl= ,XF86AudioPlay, exec, noctalia msg media toggle # [hidden]
bindl= ,XF86AudioPause, exec, noctalia msg media toggle # [hidden]

#!
##! Apps
bind = Super, T, exec, foot # Launch foot (terminal)
bind = Super, Z, exec, zeditor # Launch Zed (editor)
bind = Super, C, exec, code --password-store=gnome --enable-features=UseOzonePlatform --ozone-platform=wayland # Launch VSCode (editor)
bind = Super, E, exec, nemo # Launch Nautilus (file manager)
# bind = Super+Alt, E, exec, thunar # [hidden]
bind = Super, W, exec, zen-browser # [hidden] Let's not give people (more) reason to shit on my rice
bind = Ctrl+Super, W, exec, firefox # Launch Firefox (browser)
bind = Super, X, exec, gnome-text-editor --new-window # Launch GNOME Text Editor
bind = Super+Shift, W, exec, onlyoffice-desktopeditors # Launch WPS Office
bind = Super, I, exec, XDG_CURRENT_DESKTOP="gnome" gnome-control-center # Launch GNOME Settings
# bind = Super, I, exec, XDG_CURRENT_DESKTOP="KDE" systemsettings# Launch GNOME Settings
bind = Ctrl+Super, V, exec, pavucontrol # Launch pavucontrol (volume mixer)
bind = Ctrl+Super+Shift, V, exec, easyeffects # Launch EasyEffects (equalizer & other audio effects)
bind = Ctrl+Shift, Escape, exec, gnome-system-monitor # Launch GNOME System monitor
bind = Ctrl+Super, Slash, exec, noctalia msg panel-toggle launcher # Toggle launcher
bind = Super+Alt, Slash, exec, pkill -x fuzzel || fuzzel --show drun # Toggle fallback launcher: fuzzel

# Cursed stuff
## Make window not amogus large
bind = Ctrl+Super, Backslash, resizeactive, exact 640 480 # [hidden]
